<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stage to Stardom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#22071a;--panel:#32102a;--panel2:#441a39;--line:#5e2c52;--gold:#f2b33d;--pink:#ff6b9a;--teal:#46d1b9;--red:#ff6464;--text:#fcebdd;--muted:#c9a5bb;
--disp:'Rozha One',Georgia,'Times New Roman',serif;--body:'Mukta','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:.4rem .85rem;border-radius:8px;line-height:1.3}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#2a0a1c;border-color:var(--gold);font-weight:700}
button.danger{border-color:var(--red);color:#ffd2d2}
button.ghost{background:none}
button:disabled{opacity:.4;cursor:not-allowed}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0 0 .5rem;line-height:1.15}
h2{font-size:1.75rem;color:var(--gold)}
h3{font-size:1.2rem}
p{margin:.35rem 0}
.muted{color:var(--muted)}.small{font-size:.86rem}
.good{color:var(--teal)}.bad{color:var(--red)}.gold{color:var(--gold)}.pink{color:var(--pink)}
.top{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(.55rem + env(safe-area-inset-top,0px)) 1rem .55rem;display:flex;flex-wrap:wrap;gap:.35rem 1.3rem;align-items:center}
.who{font-family:var(--disp);font-size:1.35rem;margin-right:auto;line-height:1.1}
.who small{display:block;font-family:var(--body);font-size:.8rem;color:var(--gold)}
.stat{display:flex;flex-direction:column;min-width:64px}
.stat b{font-size:.98rem;font-weight:600}
.stat span{font-size:.72rem;color:var(--muted)}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;width:84px;margin-top:2px}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.bad i{background:var(--red)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr)}
nav{border-right:1px solid var(--line);padding:1rem .6rem;display:flex;flex-direction:column;gap:.15rem;min-height:calc(100vh - 64px)}
nav .tab{background:none;border:none;text-align:left;padding:.45rem .7rem;border-radius:6px;color:var(--muted)}
nav .tab.on{background:var(--panel);color:var(--gold)}
nav .tab .dot{display:inline-block;min-width:1.2rem;padding:0 .3rem;margin-left:.3rem;border-radius:9px;background:var(--pink);color:#2a0a1c;font-size:.72rem;text-align:center;font-weight:700}
.endweek{margin-top:1rem;padding:.75rem;font-family:var(--disp);font-size:1.15rem}
main{padding:1.2rem 1.5rem 6rem;max-width:980px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:.9rem}
.card.hl{border-color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.row.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.9rem}
.grid .card{margin:0}
.tag{display:inline-block;font-size:.76rem;padding:0 .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin:0 .25rem .2rem 0;white-space:nowrap}
.tag.hot{border-color:var(--pink);color:var(--pink)}
.tag.ok{border-color:var(--teal);color:var(--teal)}
.tag.warn{border-color:var(--red);color:var(--red)}
.feed{list-style:none;padding:0;margin:0}
.feed li{padding:.4rem 0;border-bottom:1px dashed var(--line);font-size:.94rem}
.feed .wk{color:var(--muted);font-size:.78rem;margin-right:.45rem}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.35rem .45rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:.4rem 0}
.prog i{display:block;height:100%;background:var(--teal)}
label{display:block;margin:.8rem 0 .3rem;font-weight:600}
input,select,textarea{width:100%;padding:.5rem .7rem;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;font:inherit}
input[type=range]{padding:0}
.modal{position:fixed;inset:0;background:rgba(14,2,10,.8);display:flex;align-items:center;justify-content:center;z-index:30;padding:1rem}
.modal.hidden{display:none}
.mbox{background:var(--panel);border:1px solid var(--gold);border-radius:12px;max-width:540px;width:100%;padding:1.3rem;max-height:90vh;overflow:auto}
.mbox h3{font-size:1.45rem;color:var(--gold)}
.mbox .choices{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
.mbox .choices button{text-align:left}
.verdict{font-family:var(--disp);font-size:2.4rem;line-height:1;margin:.3rem 0 .6rem}
.v0,.v1{color:var(--red)}.v2{color:var(--muted)}.v3,.v4{color:var(--teal)}.v5{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--pink);color:#2a0a1c;font-weight:700;padding:.5rem 1rem;border-radius:8px;z-index:40}
.start{max-width:680px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
.marquee{text-align:center;padding:2.2rem 0 1rem}
.marquee h1{font-size:clamp(3.2rem,13vw,6.2rem);color:var(--gold);text-shadow:0 0 22px rgba(242,179,61,.35);margin:0}
.marquee p{color:var(--muted);margin:.2rem 0 0}
.bulbs{display:flex;justify-content:center;gap:11px;margin:.5rem 0}
.bulbs i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:blink 1.8s infinite}
.bulbs i:nth-child(even){animation-delay:.9s}
@keyframes blink{50%{opacity:.25}}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.5rem}
.opt{border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;background:var(--panel);text-align:left}
.opt.sel{border-color:var(--gold);background:var(--panel2)}
.opt b{display:block}
.opt span{font-size:.82rem;color:var(--muted)}
.mobend{display:none}
.mg .mg-step{color:var(--muted);font-size:.8rem;margin:0}
.mg .mg-cue{font-family:var(--disp);font-size:1.3rem;line-height:1.25;margin:.3rem 0 .6rem}
.mg-bar{position:relative;height:34px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin:1rem 0 .4rem;overflow:hidden}
.mg-zone{position:absolute;top:0;bottom:0;background:rgba(242,179,61,.35);border-left:2px solid var(--gold);border-right:2px solid var(--gold)}
.mg-mark{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin:.6rem 0 .2rem}
.bars div{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.up{background:var(--gold)}
.bars div.down{background:var(--pink)}
.barlbl{display:flex;gap:4px;font-size:.7rem;color:var(--muted)}.barlbl span{flex:1;text-align:center}
.detail{border:1px solid var(--gold);border-radius:10px;padding:.8rem 1rem;margin-top:.6rem;background:var(--panel2)}
.detail ul{margin:.3rem 0 .2rem 1.1rem;padding:0}
.detail li{margin:.15rem 0}
.days{display:flex;gap:3px;margin-top:3px}.days i{width:9px;height:9px;border-radius:2px;background:var(--gold)}.days i.used{background:var(--panel2);border:1px solid var(--line)}
.check{display:flex;gap:.5rem;align-items:center;margin:.3rem 0;font-weight:400}.check input{width:auto}
@media (max-width:760px),(max-height:520px) and (orientation:landscape){
 .layout{grid-template-columns:1fr}
 nav{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);min-height:0;padding:.4rem;gap:.2rem}
 nav .tab{white-space:nowrap}
 nav .endweek{display:none}
 main{padding:1rem 1rem 6rem}
 .mobend{display:block;position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:7;box-shadow:0 4px 18px rgba(0,0,0,.5)}
 .top{position:static}
 .top{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
 .top .who{grid-column:1/-1}
 button{min-height:40px}
 .tablewrap table{font-size:.85rem}
 .mbox{width:100%;max-height:88vh;overflow-y:auto}
 .navgrp{display:none}
 nav{align-items:center}
 nav [role=group]{display:flex;align-items:center;gap:.3rem;margin-top:0!important;white-space:nowrap}
 nav [role=group]>span{display:none}
 nav [role=group]>div{margin-top:0!important}
 nav [role=group] button{width:2.6rem;flex:none!important}
 .grid{grid-template-columns:1fr}
}
.navgrp{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:.7rem .2rem .2rem}
.tip{border:1px dashed var(--gold);border-radius:8px;padding:.5rem .8rem;margin-bottom:.8rem;font-size:.9rem}
.mg-arrows{display:flex;gap:.5rem;justify-content:center;margin:.8rem 0}.mg-arrows button{font-size:1.6rem;width:3.4rem;height:3.4rem}
.mg-big{font-family:var(--disp);font-size:2.2rem;text-align:center;margin:1rem 0}
.mg-seq{font-size:2rem;text-align:center;letter-spacing:.5rem;min-height:2.6rem}
.words{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.inboxbtn{position:relative}

html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,.tab,.opt{touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media (max-width:760px),(max-height:520px) and (orientation:landscape){
 body{font-size:16px}
 .top{padding-top:calc(.6rem + env(safe-area-inset-top,0px))}
 nav{position:sticky;top:0;z-index:6;background:var(--bg)}
 .mbox{padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
 .mbox .choices button{width:100%;text-align:left;padding:.75rem .9rem}
 main{padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))}
 input,select,textarea{font-size:16px}
 .mg-arrows button{width:4rem;height:4rem}
}
@media (prefers-reduced-motion:reduce){.bulbs i{animation:none}}
</style>
</head>

function modal(title,html,choices){
 const m=$('#modal');
 m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div>${html}</div><div class="choices">${choices.map((c,i)=>`<button data-i="${i}" ${c.dis?'disabled':''} class="${i===0&&choices.length===1?'primary':''}">${c.t}</button>`).join('')}</div></div>`;
 m.classList.remove('hidden');
 m.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const c=choices[+b.dataset.i];m.classList.add('hidden');const r=c.f?c.f():null;normalize();
  if(typeof r==='string'&&r){modal(title,`<p>${r}</p>`,[{t:'Continue'}]);}else{render();nextQ();}});
 const f=m.querySelector('button:not(:disabled)');if(f)f.focus();
}
function nextQ(){if(!$('#modal').classList.contains('hidden'))return;if(Q.length){const e=Q.shift();e();}else{save();render();}}
function info(title,text){Q.push(()=>modal(title,`<p>${text}</p>`,[{t:'Continue'}]));}

/* ---------- mini-game ---------- */
let MG=null;
document.addEventListener('keydown',e=>{if(MG&&(e.code==='Space'||e.key===' ')){e.preventDefault();MG();}});
function miniGame(cfg,done){
 if(!(S.settings.mini==='all'||(S.settings.mini==='key'&&cfg.key)))return done(clamp(Math.round(cfg.auto+R(-12,12)),5,100));
 const m=$('#modal');m.classList.remove('hidden');
 const scores=[];let i=0,retakes=cfg.retakes||0;
 const box=h=>`<div class="mbox mg" role="dialog" aria-modal="true" aria-label="${esc(cfg.title)}"><h3>${esc(cfg.title)}</h3>${h}</div>`;
 const finish=()=>{MG=null;m.classList.add('hidden');done(Math.round(scores.reduce((a,b)=>a+b,0)/scores.length));};
 const nextBeat=()=>{if(i>=cfg.beats.length)return finish();const b=cfg.beats[i];
  if(b.opts){m.innerHTML=box(`<p class="mg-step">Beat ${i+1} of ${cfg.beats.length}</p><p class="mg-cue">${esc(b.t)}</p><p class="small muted">${cfg.ask}</p><div class="choices">${b.opts.map((o,k)=>`<button data-k="${k}">${esc(o[0])}</button>`).join('')}</div>`);
   m.querySelectorAll('button[data-k]').forEach(btn=>btn.onclick=()=>bar(b,b.opts[+btn.dataset.k][1]));m.querySelector('button').focus();}
  else bar(b,null);};
 const bar=(b,cs)=>{const zone=clamp(cfg.zone,8,40),hz=zone/2,center=R(Math.ceil(hz)+4,96-Math.ceil(hz)),speed=cfg.speed*(1+i*.22);let pos=0,dir=1,last=performance.now(),raf;
  m.innerHTML=box(`<p class="mg-step">Beat ${i+1} of ${cfg.beats.length}</p><p class="mg-cue">${esc(b.t)}</p><p class="small muted">${cfg.timing}</p><div class="mg-bar"><div class="mg-zone" style="left:${center-hz}%;width:${zone}%"></div><div class="mg-mark" id="mgm"></div></div><div class="choices"><button class="primary" id="mggo">${cfg.go} (or press space)</button></div>`);
  const mark=$('#mgm');
  const tick=t=>{const dt=Math.min(50,t-last);last=t;pos+=dir*speed*dt/16;if(pos>=100){pos=100;dir=-1;}if(pos<=0){pos=0;dir=1;}mark.style.left=pos+'%';raf=requestAnimationFrame(tick);};
  raf=requestAnimationFrame(tick);
  const press=()=>{cancelAnimationFrame(raf);MG=null;const d=Math.abs(pos-center);const t=d<=hz?Math.round(100-d/hz*15):Math.max(0,Math.round(85-(d-hz)*4));const sc=cs==null?t:Math.round(t*.5+cs*.5);
   const word=sc>=90?'Perfect take!':sc>=70?'Good take.':sc>=45?'Usable.':'That one was off.';
   const btns=[`<button class="primary" id="mgok">${i+1<cfg.beats.length?'Next beat':'Finish'}</button>`];if(retakes>0&&sc<85)btns.push(`<button id="mgre">Retake (${retakes} left${cfg.retakeCost?', '+cfg.retakeCost:''})</button>`);
   m.innerHTML=box(`<p class="mg-cue">${word}</p><p>Score <b>${sc}</b>${cs!=null?` <span class="small muted">(choice ${cs}, timing ${t})</span>`:''}</p><div class="choices">${btns.join('')}</div>`);
   $('#mgok').onclick=()=>{scores.push(sc);i++;nextBeat();};const re=$('#mgre');if(re)re.onclick=()=>{retakes--;if(cfg.onRetake)cfg.onRetake();bar(b,cs);};$('#mgok').focus();};
  $('#mggo').onclick=press;MG=press;$('#mggo').focus();};
 nextBeat();
}

function genWorld(){
 S.houses=[];S.people=[];
 for(let t=0;t<4;t++){for(let i=0;i<6;i++)S.houses.push(newHouse(t));for(let i=0;i<12;i++)S.people.push(newPerson(t,'actor'));for(let i=0;i<5;i++)S.people.push(newPerson(t,'director'));for(let i=0;i<3;i++)S.people.push(newPerson(t,'producer'));}

function shiftTrend(first){const gs=Object.keys(GENRES),old=S.trend&&S.trend.hot;const hot=pick(gs.filter(g=>g!==old));const cold=old||pick(gs.filter(g=>g!==hot));S.trend={hot,cold,until:S.week+R(20,38)};

 for(let t=0;t<4;t++)for(let w=from;w<=S.week+12;w++){if(!S.comp.some(c=>c.tier===t&&c.week===w)&&rnd()<(festival(t,w)?.8:.38)){const riv=t===S.unlocked&&rnd()<.15;const st=pick(S.people.filter(p=>p.tier===t&&p.job==='actor'));

function attracted(p){const s=S.sexuality;if(['bi','pan','everyone','ace'].includes(s))return true;if(s==='straight')return(S.gender==='m'&&p.g==='f')||(S.gender==='f'&&p.g==='m');if(s==='gay')return p.g===S.gender;if(s==='men')return p.g==='m';if(s==='women')return p.g==='f';return true;}

 const hs=S.houses.filter(h=>h.tier===t),ds=S.people.filter(p=>p.tier===t&&p.job==='director'),cs=S.people.filter(p=>p.tier===t&&p.job==='actor');

function finishShoot(p,mode,sc){
 const dir=p.kind==='dir',sk=dir?(p.selfCast?(S.skills.directing+genreSkill(p.genre))/2:S.skills.directing):genreSkill(p.genre);
 let mult=MODES[mode].m*(.85+S.health/700)*(.85+S.happy/500),notes=[];
 if(S.inj){mult*=.75;notes.push('You shot through the pain.');}
 if(!dir&&S.buff==='dancer'&&['Romance','Comedy'].includes(p.genre))mult*=1.1;
 if(!dir&&p.suit)mult*=.7;
 if(!dir&&p.req&&!p.suit&&!fits(p.req)){mult*=.75;notes.push('Your body no longer matches earlier scenes. Continuity errors everywhere.');}
 p.perf+=(sk*.45+sc*.55)*mult;p.weeksDone++;p.shot=true;
 if(dir){S.skills.directing+=.4;p.contingency-=p.budget*({quick:0,std:.008,perfect:.02}[mode]);}else S.skills.acting+=.3;

 const risky=['Action','Sci-Fi','Mythological'].includes(p.genre)||(!dir&&p.req==='Muscular');
 let ich=(risky?{quick:.02,std:.045,perfect:.08}[mode]:{quick:.005,std:.01,perfect:.02}[mode])*(130-S.health)/80*(dir&&!p.selfCast?.4:1);
 if(S.inj){if(rnd()<.25){S.inj.pts+=20;S.inj.max+=20;S.health-=5;notes.push('<span class="bad">You made the injury worse.</span>');}}
 else if(rnd()<ich)injure(p.title);
 if(p.kind==='dir')protoDirShoot(p);else protoActShoot(p);
 log(`${MODES[mode].n} on ${p.title}. Scene score ${Math.round(sc)}.`);
 if(dir&&p.contingency<0&&!p.overrun){p.overrun=true;Q.push(()=>overrunEvent(p));}
 if(p.weeksDone>=p.weeksTotal)wrap(p);
 else{const co=(p.cast||[]).map(person).filter(Boolean);if(co.length&&rnd()<.14){const c=pick(co);
  Q.push(()=>modal('Between takes',`<p>${esc(c.name)} sits beside you during a long lighting setup on <i>${esc(p.title)}</i>.</p>`,[
   {t:'Grab chai and talk for hours',f:()=>{c.rel+=8;if(canRomance(c))c.rom+=6;return`You and ${esc(c.name)} hit it off.${canRomance(c)?' People on set notice the sparks.':''}`}},
   {t:'Run lines together',f:()=>{c.rel+=5;p.perf+=4;return'The next scene crackles. Good chemistry.'}},
   {t:'Keep it professional',f:()=>{c.rel+=1;return'You stay focused.'}}]));}}

}

  <label for="cu-${p.id}">Final cut</label><select id="cu-${p.id}" onchange="A.edSet('${p.id}','cut',this.value)" ${p.forcedCut?'disabled':''}>${[['director',"Director's cut: critics love it"],['theatrical','Balanced theatrical cut'],['producer',"Producer's cut: crowd-pleaser"]].filter(x=>!(p.own&&x[0]==='producer')).map(([v,n])=>`<option value="${v}" ${e.cut===v?'selected':''}>${n}</option>`).join('')}</select>
  ${testHTML(p)}`;
  acts=`<button onclick="A.testScreen('${p.id}')" ${e.tested?'disabled':''}>Test screening (1 day)</button><button onclick="A.reshoot('${p.id}')" ${e.reshot?'disabled':''}>Reshoot weak scenes (3 days, ${money(p.budget*.06)})</button><button onclick="A.reedit('${p.id}')" ${e.reedited?'disabled':''}>Re-edit for pace (1 day)</button><button onclick="A.itemSong('${p.id}')" ${p.item?'disabled':''}>Add an item song (${money(p.budget*.03)})</button><button class="primary" onclick="A.lockEdit('${p.id}')">Lock the edit</button>`;}
 else if(p.status==='post')body=`<p>In post-production. Ready around week ${(p.postUntil-1)%52+1}. Start promoting.</p>`;

  ${showMk?`<h3 style="margin-top:.6rem">Marketing</h3><p class="small muted">${p.own?'Your studio pays for everything.':`The producer will spend up to ${money(pool)}. Anything above that comes from your pocket.`} Selected: ${money(cost)}.</p>

  ${p.rights&&p.own?`<h3 style="margin-top:.6rem">Pre-release business</h3><p class="small muted">Sell rights now for guaranteed money, or hold them: after release they sell for much more if the film is a hit, and far less if it flops.</p>${Object.entries(p.rights).map(([k,x])=>`<div class="row sp small" style="padding:.25rem 0"><span>${RIGHTS[k][0]}: ${money(x.v)} now</span>${x.sold?tag('Sold','ok'):`<button onclick="A.sellRight('${p.id}','${k}')">Sell now</button>`}</div>`).join('')}${p.tableProfit?'<p class="good small">Table profit: the budget is already recovered.</p>':''}`:p.tableProfit?'<p class="good small">The producer has already recovered most of the budget through rights. A table profit.</p>':''}
  ${p.tier===1&&(p.kind==='dir'||p.say==='full')?`<label class="check"><input type="checkbox" ${p.pan?'checked':''} onchange="A.pan('${p.id}')"> Dub and release pan-India${p.own?` (${money(p.budget*.08)})`:''}: a much bigger opening, but a weak film crashes everywhere</label>`:''}
  ${p.kind==='dir'?festHTML(p):''}

   return`<tr><td>${w} wk</td><td>${fe?`<span class="gold">${fe}</span>`:''}</td><td>${cs.length?cs.map(c=>`<span class="${c.power>60?'bad':''}">${esc(c.title)} (${esc(c.star)}, buzz ${c.power})</span>`).join(', '):'<span class="good">Clear</span>'}</td><td><button onclick="A.confirmRelease('${p.id}',${w})">Release</button></td></tr>`;}).join('')}</table></div>`;
  if(p.kind==='dir')acts=`<button onclick="A.ott('${p.id}')">Sell to a streaming platform instead</button>`;}
 else if(p.status==='scheduled'){const cs=S.comp.filter(c=>c.tier===p.tier&&c.week===p.releaseWeek),fe=festival(p.tier,p.releaseWeek);body=`<p>Releases in <b>${p.releaseWeek-S.week} week(s)</b>${fe?`, over <span class="gold">${fe}</span>`:''}.${p.kind==='act'&&!p.say?' <span class="small muted">The producer picked the date. More star power gets you a say.</span>':''}${cs.length?` <span class="bad">Clashing with ${cs.map(c=>esc(c.title)).join(', ')}.</span>`:''}</p>`;}

 <div class="detail"><b class="gold">${b.name}</b><p class="small">Only this background gets:</p><ul class="small">${b.perks.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small">The catch:</p><ul class="small muted">${b.cons.map(x=>`<li>${x}</li>`).join('')}</ul></div>

 d.rival.h2h=d.rival.h2h||{w:0,l:0};d.rivalD.h2h=d.rivalD.h2h||{w:0,l:0};d.rivalS.h2h=d.rivalS.h2h||{w:0,l:0};
 d.fr=d.fr||[];d.pairs=d.pairs||{};d.pstale=d.pstale||{};d.susp=d.susp||0;d.headline=d.headline||'';
 if(!d.allTime){d.allTime=[[],[],[],[]];for(let t=0;t<4;t++)for(let i=0;i<8;i++){const b=(TIERS[t].budget[0]+TIERS[t].budget[1])/2;let ti;do{ti=t===0?pick(PLAYS):t===3?pick(HT_A)+' '+pick(HT_B):pick(T_A)+' '+pick(T_B);}while(d.allTime[t].some(x=>x.title===ti));d.allTime[t].push({title:ti,star:personName(t,pick(['m','f'])),gross:Math.round(b*rr([1.5,5.5])),yr:'Classic'});}}
 return d;}

/* ---------- skipping weeks ---------- */
let SKIP=null;
const _MODAL_BASE=modal;
modal=function(title,html,choices){
 if(SKIP&&choices.length===1&&!choices[0].dis){const c=choices[0];const r=c.f?c.f():null;normalize();SKIP.dig.push(title);if(typeof r==='string'&&r&&r.length<160)SKIP.dig.push('  '+r.replace(/<[^>]+>/g,''));nextQ();return;}
 if(SKIP)SKIP.stop=title;
 return _MODAL_BASE(title,html,choices);};
function skipBlock(){if(S.projects.some(p=>p.status==='shoot'))return'You are in the middle of a shoot. Skipping would miss your schedule.';
 if(S.projects.some(p=>p.status==='edit'))return'A film is waiting for you in the edit suite.';
 if(S.projects.some(p=>p.status==='plan'))return'A release needs planning first.';
 if(S.dev&&S.dev.stage==='pre')return'You are in the middle of casting.';return null;}
A.skip=n=>{if(!$('#modal').classList.contains('hidden'))return;const b=skipBlock();if(b)return toast(b);
 SKIP={dig:[],stop:null,start:S.week,why:null};const special=()=>S.offers.filter(o=>o.seq||o.fav||o.comeback).length;let sp=special(),aw=!!S.aw,done=0;
 for(let i=0;i<n;i++){endWeek();done++;if(SKIP.stop)break;const bl=skipBlock();if(bl){SKIP.why=bl.replace('Skipping would miss your schedule.','Shooting has started.');break;}
  if(!aw&&S.aw){SKIP.why='You have been nominated for an award. Time to campaign.';break;}if(special()>sp){SKIP.why='A special offer is waiting.';break;}}
 const sk=SKIP;SKIP=null;const heads=S.log.filter(l=>l.w>sk.start&&['gold','bad','good'].includes(l.c)).slice(0,14);
 const sum=()=>modal(`Skipped ${done} week${done>1?'s':''}`,`${sk.why?`<p class="pink">Stopped early: ${esc(sk.why)}</p>`:sk.stop?`<p class="pink">Stopped early: something needs your decision.</p>`:''}<ul class="feed">${heads.map(l=>`<li class="${l.c}">${esc(l.t)}</li>`).join('')||'<li>A quiet stretch. Nothing major happened.</li>'}</ul>`,[{t:'Continue'}]);
 if(sk.stop)Q.push(sum);else{render();sum();}};

const PROMO2={interview:['TV interviews',1,10,0,6,[],'Safe and steady.'],trailer:['Trailer launch event',1,10,2,10,['Action','Sci-Fi','Thriller','Horror'],'Best for spectacle.'],
 music:['Grand music launch',1,15,2,9,['Romance','Comedy'],'Better when the songs are good.'],tour:['Multi-city promo tour',2,25,1,12,[],'Huge reach, exhausting.'],
 college:['College campus tour',2,20,0,9,['Romance','Comedy','Horror'],'Young audiences.'],reality:['Reality show appearance',1,15,0,10,['Comedy','Romance'],'Live TV can go wrong.'],
 cricket:['Cricket match appearance',1,10,3,11,['Action','Drama','Comedy'],'Massive reach. Not for plays.'],temple:['Temple visit with the press',1,8,0,6,['Mythological','Drama'],'Families love it.'],
 kids:['Kids TV special',1,10,0,7,['Comedy','Mythological','Sci-Fi'],'Brings families.'],podcast:['Podcast circuit',1,10,0,7,['Drama','Thriller'],'Serious viewers, better reviews.'],
 meme:['Meme marketing',0,5,1,7,['Comedy'],'Cheap. Scales with your followers.'],fanmeet:['Fan meet-and-greet',1,15,0,6,[],'Grows your fan club.'],
 stunt:['Live stunt show',1,20,1,10,['Action','Sci-Fi'],'Thrilling, and risky.'],costar:['Joint interview with your co-star',1,10,0,8,['Romance','Comedy'],'Chemistry sells.'],
 controversy:['Manufactured controversy',0,5,0,16,[],'Huge buzz. It can backfire badly.']};
function promoGain(p,k){const[,,,,h,gs]=PROMO2[k];let g=h;if(gs.includes(p.genre))g*=1.4;if(k==='music'&&p.album)g*=p.album.q/60;if(k==='music'&&S.buff==='dancer')g*=1.3;if(k==='meme')g+=followerBoost()/3;
 const u=(p.puse||{})[k]||0;g/=1+u*.7;g/=1+(S.pstale[k]||0)*.15;return g;}

A.promote=(id,k)=>{const p=proj(id),P=PROMO2[k];if(!P||!promoOk(p,k))return;const[name,days,e,c]=P;if(!p.pw)p.pw={w:0,done:[]};if(p.pw.w!==S.week)p.pw={w:S.week,done:[]};if(p.pw.done.includes(k))return;
 const cost=c*tc()*3;if(cost&&S.money<cost)return toast('You cannot afford that.');if(!act(days,e))return;S.money-=cost;
 const gain=promoGain(p,k)+R(0,3);p.pw.done.push(k);p.puse=p.puse||{};p.puse[k]=(p.puse[k]||0)+1;S.pstale[k]=(S.pstale[k]||0)+1;S.followers+=Math.round(S.followers*.01+50);let msg;
 if(p.status==='running'){const r=p.run;r.promos=(r.promos||0)+1;const b=gain/100*.3/(1+(r.promos-1)*.6)*(r.aud>=50?1:.4);r.wom=(r.wom||0)+b;msg=`${name} for ${p.title} while it is in theatres. Next week gets a ${Math.round(b*100)}% push.`;}
 else{p.hype=clamp(p.hype+Math.round(gain*(1-p.hype/120)),0,100);msg=`${name} for ${p.title}. Hype +${Math.round(gain*(1-p.hype/120))}.`;}
 if(k==='reality'&&rnd()<.12){S.scandal+=8;msg+=' A joke on live TV did not land. Scandal rises.';}
 if(k==='controversy'){if(rnd()<.4){S.scandal+=12;p.controv=true;msg+=' It spiralled out of control. Critics are now hostile.';}else msg+=' Everyone is talking about it.';}
 if(k==='stunt'&&rnd()<.05&&!S.inj){injure(`the ${p.title} stunt show`);}
 if(k==='fanmeet')S.fans+=Math.round(S.fans*.03+80);if(k==='podcast')p.critBuzz=(p.critBuzz||0)+2;
 if(k==='costar'){const c2=person(p.coId);if(c2)c2.rel+=5;}
 log(msg);render();};


/* ---------- negotiation ---------- */
function signModal(o,passed,sc){const h=house(o.houseId)||S.houses.find(x=>x.tier===o.tier),cc=relFame(o.tier)>=.7||o.tier<S.unlocked||(S.buff==='nepo'&&S.influence>=50);
 const body=o.req?`<p class="small ${fits(o.req)?'good':'pink'}">Body: the role needs you ${BODY_INFO[o.req]} for ${BODY_ROLE[o.req]}. You are ${bodyType().toLowerCase()} now. Shooting starts in ${o.prep} week(s).</p>`:`<p class="small muted">Shooting starts in ${o.prep} week(s).</p>`;
 modal(passed?`You got the part: ${o.title}`:`Offer: ${o.title}`,`<p>${o.role} in ${/^[aeiou]/i.test(o.sub)?'an':'a'} ${o.sub.toLowerCase()} ${unitOf(o.tier)} from <b>${esc(h.name)}</b>. ${o.weeks} weeks of shooting. Budget about ${money(o.budget)}.</p><p>Their opening offer: <b>${money(o.fee)}</b>.</p>${body}<p class="small muted">${houseInfo(h)}</p><p class="small">Pick the kind of deal you want, then negotiate.</p>`,[
  {t:`Full fee upfront (${money(o.fee)})`,f:()=>{negotiate(o,{type:'fee',fee:o.fee,share:0,round:0});return null;}},
  {t:`Lower fee plus a profit share (${money(o.fee*.6)} + 8%)`,f:()=>{negotiate(o,{type:'mix',fee:Math.round(o.fee*.6),share:.08,round:0});return null;}},
  {t:`Back-end deal: a token fee and a big profit share (${money(o.fee*.15)} + 22%)`,f:()=>{negotiate(o,{type:'back',fee:Math.round(o.fee*.15),share:.22,round:0});return null;}},
  {t:'Full fee and creative control',dis:!cc,f:()=>{signOffer(o,{creative:true});}},
  {t:'Walk away',f:()=>{S.offers=S.offers.filter(x=>x.id!==o.id);}}]);}
function negCh(o,dl,big){const d=person(o.dirId),h=house(o.houseId);return clamp(.5+Math.min(clout({tier:o.tier,role:o.role}),1.2)*.3+(S.agent?S.agent.lvl===2?.15:.07:0)+(d?d.rel/250:0)+(S.buff==='nepo'?.08:0)+(h.wealth-1)*.2-dl.round*.13-(big?.2:0)-(o.aud?0:-.05),.05,.9);}
function dealTxt(dl){return`${money(dl.fee)}${dl.share?` + ${Math.round(dl.share*100)}% of profits`:''}`;}
function negotiate(o,dl,msg){const h=house(o.houseId),fin=dl.round>=3||dl.final;
 const up=(big)=>{const ch=negCh(o,dl,big);if(rnd()<ch){if(dl.type==='fee')dl.fee=Math.round(dl.fee*(big?1.3:1.15));else{dl.share=+(dl.share+(big?.05:.025)).toFixed(3);if(dl.type==='mix')dl.fee=Math.round(dl.fee*(big?1.12:1.05));}dl.round++;negotiate(o,dl,`${esc(h.name)} agrees. New terms: <b>${dealTxt(dl)}</b>.`);}
  else if(rnd()<.2+dl.round*.12+(big?.15:0)){S.offers=S.offers.filter(x=>x.id!==o.id);const d=person(o.dirId);if(d)d.rel-=5;log(`${h.name} withdrew the offer for ${o.title} after tough negotiations.`,'bad');modal('Offer withdrawn',`<p>"We cannot work with these demands." ${esc(h.name)} has offered the role to someone else.</p>`,[{t:'Continue'}]);}
  else{dl.final=true;negotiate(o,dl,`${esc(h.name)} refuses to budge. This is their final offer: <b>${dealTxt(dl)}</b>.`);}};
 modal(`Negotiating: ${o.title}`,`${msg?`<p>${msg}</p>`:''}<p>Current terms: <b>${dealTxt(dl)}</b>.</p><p class="small muted">Asking for more can improve the deal, but every round makes the producer more impatient.${S.agent?' Your agent is negotiating for you.':' An agent would improve your odds.'}</p>`,[
  {t:`Accept: ${dealTxt(dl)}`,f:()=>{signOffer(o,{fee:dl.fee,share:dl.share});}},
  {t:dl.type==='fee'?'Ask for 15% more':'Ask for a slightly bigger share',dis:fin,f:()=>{up(false);return null;}},
  {t:dl.type==='fee'?'Ask for 30% more':'Ask for a much bigger share',dis:fin,f:()=>{up(true);return null;}},
  {t:'Walk away',f:()=>{S.offers=S.offers.filter(x=>x.id!==o.id);}}]);}
function dirDeal(){const dv=S.dev;if(!dv||dv.own||!dv.fee)return nextQ();
 modal('Your director deal',`<p>The producer offers you a director fee of <b>${money(dv.fee)}</b>. How do you want to be paid?</p>`,[
  {t:`Take the fee (${money(dv.fee)}), half now`,f:()=>{S.money+=Math.round(dv.fee/2);dv.share=0;}},
  {t:`Half the fee plus 10% of the profits`,f:()=>{dv.fee=Math.round(dv.fee/2);S.money+=Math.round(dv.fee/2);dv.share=.1;return'A bet on yourself.'}},
  {t:'No fee, 20% of the profits',f:()=>{dv.fee=0;dv.share=.2;return'All in. If the film works, you get rich.'}}]);}

const ROM={date:['Date night',1,10,2,[10,15]],cook:['Cook dinner together',1,8,.3,[5,8]],movie:['Movie marathon at home',1,-10,0,[4,7]],dance:['Dance class together',1,12,.5,[5,8]],
 trip:['Weekend getaway',2,0,6,[12,18]],gift:['Surprise gift',0,0,3,[6,10]],public:['Step out as a couple',1,8,1,[3,6]],talk:['A deep talk about the future',1,5,0,[5,9]],family:['Meet their family',1,10,1,[6,12]],movein:['Move in together',1,10,0,[10,14]]};
A.rom=k=>{const pp=person(S.partner);if(!pp)return;const[n,d,e,c,[a,b]]=ROM[k];if(k==='date')return A.date(pp.id);const cost=Math.round(c*tc());if(S.money<cost)return toast('You cannot afford that.');
 if(k==='family'&&pp.metFam)return;if(k==='movein'&&pp.livein)return;if(k==='gift'&&pp.gift===S.week)return toast('One gift a week is plenty.');
 if(d&&!act(d,Math.max(0,e)))return;if(!d&&S.energy<e)return;S.money-=cost;if(e<0)S.energy-=e;let g=R(a,b),msg=`${n} with ${pp.name}.`;
 if(k==='gift'){pp.gifts=(pp.gifts||0)+1;g=Math.round(g/(1+(pp.gifts-1)*.3));pp.gift=S.week;}
 if(k==='public'){S.followers+=Math.round(S.followers*.015);if(rnd()<.1&&!S.married){S.scandal+=3;msg+=' Some fans are jealous.';}}
 if(k==='family'){pp.metFam=true;if(rnd()<.25){g=-4;msg+=' Their father asked when you will get a proper job.';}else msg+=' They loved you.';}
 if(k==='movein'){pp.livein=true;S.happy+=5;msg+=' Your place finally feels like home.';}
 if(k==='dance')S.skills.dance+=.5;if(k==='talk'&&pp.rom>60)msg+=' You both want the same things.';
 pp.rom+=g;pp.rel+=Math.round(g/2);S.happy+=Math.max(1,Math.round(g/3));S.lastDate=S.week;log(msg);normalize();render();};
A.flirt=id=>{const p=person(id);if(!canRomance(p)||S.energy<3)return;S.energy-=3;const ok=rnd()<.6+p.rel/200;p.rom+=ok?R(3,6):0;p.rel+=ok?2:-2;
 if(S.partner&&S.partner!==id&&rnd()<.08){const pp=person(S.partner);pp.rom-=6;log(`${pp.name} saw you flirting with ${p.name}.`,'bad');}
 log(ok?`You flirted with ${p.name}. They flirted back.`:`You flirted with ${p.name}. It was awkward.`);normalize();render();};
function loveCard(){const pp=S.partner&&person(S.partner),aff=S.people.find(p=>p.affair);
 if(!pp)return`<div class="card"><h3>Love</h3><p class="muted">Single. Flirt with people you know and ask them out when the spark is there.</p></div>`;
 const neglect=S.week-S.lastDate>4;
 return`<div class="card"><h3>Love</h3><p>${S.married?'Married to':'Dating'} <b>${esc(pp.name)}</b>${pp.livein&&!S.married?', living together':''}. Romance ${pp.rom}.${neglect?' <span class="bad">They feel neglected.</span>':''}</p>

/* ================= Intro guide: how Indian cinema works ================= */
const GUIDE=[
 {h:'Welcome to Stage to Stardom',b:`<p class="mg-cue" style="text-align:center">From Local Stage to Global Star.</p>
  <p>You are a nobody with a dream. Start on a small-town stage in India, become a star in your home state's film industry, conquer Bollywood, and finally take on Hollywood.</p>
  <p>Play as an <b>actor</b> or a <b>director</b>. Choose your roles, survive flops and scandals, fall in love, build a dynasty, and live through real film history from the 1950s to today.</p>
  <p class="small muted">If you are new to Indian cinema, the next few pages explain how it works. It takes about a minute.</p>`},
 {h:'India has many film industries',b:`<p>India makes more films than any other country, but they do not come from one place. Each major language has its <b>own film industry</b>, with its own stars, studios, audiences and style.</p>
  <div class="tablewrap"><table><tr><th>Language</th><th>Industry nickname</th><th>Home base</th></tr>
  <tr><td>Hindi</td><td><b>Bollywood</b></td><td>Mumbai</td></tr><tr><td>Tamil</td><td><b>Kollywood</b></td><td>Chennai</td></tr><tr><td>Telugu</td><td><b>Tollywood</b></td><td>Hyderabad</td></tr>
  <tr><td>Kannada</td><td><b>Sandalwood</b></td><td>Bengaluru</td></tr><tr><td>Malayalam</td><td><b>Mollywood</b></td><td>Kochi</td></tr><tr><td>Bengali</td><td>Bengali cinema</td><td>Kolkata</td></tr>
  <tr><td>Marathi</td><td>Marathi cinema</td><td>Mumbai and Pune</td></tr><tr><td>Punjabi</td><td>Pollywood</td><td>Mohali and Chandigarh</td></tr></table></div>
  <p class="small muted">Most nicknames mix a local word with "Hollywood". Bollywood comes from Bombay, the old name of Mumbai.</p>`},
 {h:'Your home state decides where you begin',b:`<p>When you create your character, you pick an Indian state. That state's language decides your <b>regional industry</b>: start in Karnataka and you will rise through Sandalwood; start in Tamil Nadu and it will be Kollywood.</p>
  <p>Regional industries are huge in their own right. Some of India's biggest blockbusters were Telugu, Tamil and Kannada films that were later dubbed into other languages and released across the whole country. The game calls these <b>pan-India</b> releases.</p>
  <p><b>Bollywood</b>, the Hindi industry in Mumbai, reaches the whole country and Indian audiences abroad, which is why it is the next step up.</p>`},
 {h:'The ladder you will climb',b:`<div style="display:grid;gap:.5rem;margin:.6rem 0">${[['1','Local theatre','Stage plays in your home town. Tiny fees, a lot of learning.'],['2','Regional cinema','Your state\'s film industry. Real films, real fans.'],['3','Bollywood','National fame. Big budgets, bigger sharks.'],['4','Hollywood','The global stage.']].map(([n,t,d],i)=>`<div class="card" style="margin:0;display:flex;gap:.8rem;align-items:center;margin-left:${i*1.2}rem"><span class="mg-big" style="margin:0;color:var(--gold);min-width:2rem">${n}</span><span><b>${t}</b><br><span class="small muted">${d}</span></span></div>`).join('')}</div>
  <p>Your <b>fame</b> unlocks each step. You can still take work in smaller industries after moving up.</p>`},
 {h:'Money and the box office',b:`<p>Indian money is counted in <b>lakhs</b> and <b>crores</b>:</p>
  <ul class="feed"><li>₹1 lakh = 100,000 rupees</li><li>₹1 crore = 100 lakh = 10 million rupees</li></ul>
  <p>Every release gets a <b>verdict</b>, based on what it earns compared with its budget:</p>
  <p>${['Disaster','Flop','Average','Hit','Superhit','Blockbuster'].map((v,i)=>`<span class="tag v${i}" style="margin:.15rem">${v}</span>`).join(' ')}</p>
  <p>Big films release on festival weekends like <b>Diwali</b>, <b>Eid</b> and <b>Christmas</b>, when the most people go to the cinema. In older decades, a hit could run for months: 25 weeks is a <b>silver jubilee</b>, 50 weeks a <b>golden jubilee</b>.</p>`},
 {h:'A few words you will see',b:`<ul class="feed">
  <li><b>Masala film</b>: a crowd-pleaser that mixes action, romance, comedy, drama and songs.</li>
  <li><b>Mass</b> and <b>class</b>: films for the widest popular audience, or for critics and urban viewers.</li>
  <li><b>Item song</b>: a flashy standalone dance number added to boost a film.</li>
  <li><b>Star kid</b> or <b>nepo kid</b>: the child of a film family, with doors already open.</li>
  <li><b>Fan clubs</b>: devoted fans who celebrate a star's release with giant cut-outs and first-day shows.</li>
  <li><b>U, UA, A</b>: India's film certificates, from family viewing to adults only.</li>
  <li><b>Muhurat</b>: a ceremonial first shot on a film's first day, for good luck.</li></ul>
  <p>That is all you need. Lights, camera, action.</p>`}];
